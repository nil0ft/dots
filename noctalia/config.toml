[theme]
mode = "dark"

[bar.main]
position = "top"
margin_ends = 0
concave_edge_corners = true
start = ["workspaces"]
center = ["clock"]
end = ["tray", "network", "volume"]

[widget.network]
show_label = false

[shell]
polkit_agent = true

[shell.launcher]
categories = false
compact = true

[shell.panel]
open_near_click_control_center = true

[weather]
enabled = false

[widget.clock]
interactive = false
